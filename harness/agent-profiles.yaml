# Política aprobada de agentes y modelos. `.claude/agents/` materializa estos perfiles; no redefine la verdad funcional.
# Techo automático: Sonnet 5.5 / medium. Escalamiento automático permitido solo implementer low -> implementer-high
# (sin permiso del usuario, con motivo breve trazado). Nunca Haiku -> Sonnet automático: si Haiku high no basta,
# el leader registra BLOCKED o DECISION_REQUIRED.
# implementer e implementer-high son el mismo rol lógico (harness/roles/implementer.md); cambia solo el esfuerzo.
claude:
  leader:
    role: leader
    modelAlias: "Sonnet 5.5"
    exactModelId: "claude-sonnet-5-5"
    reasoningEffort: "medium"
  sdd-analyst:
    role: sdd-analyst
    modelAlias: "Sonnet 5.5"
    exactModelId: "claude-sonnet-5-5"
    reasoningEffort: "low"
  implementer:
    role: implementer
    modelAlias: "Haiku 5.5"
    exactModelId: "claude-haiku-5-5"
    reasoningEffort: "low"
    escalatesTo: implementer-high
  implementer-high:
    role: implementer
    modelAlias: "Haiku 5.5"
    exactModelId: "claude-haiku-5-5"
    reasoningEffort: "high"
  contract-reviewer:
    role: contract-reviewer
    modelAlias: "Sonnet 5.5"
    exactModelId: "claude-sonnet-5-5"
    reasoningEffort: "low"
  ux-reviewer:
    role: ux-reviewer
    modelAlias: "Sonnet 5.5"
    exactModelId: "claude-sonnet-5-5"
    reasoningEffort: "low"
  reviewer:
    role: reviewer
    modelAlias: "Sonnet 5.5"
    exactModelId: "claude-sonnet-5-5"
    reasoningEffort: "medium"
  merge-reviewer:
    role: merge-reviewer
    modelAlias: "Sonnet 5.5"
    exactModelId: "claude-sonnet-5-5"
    reasoningEffort: "medium"
  human-reviewer:
    role: human-reviewer
    actor: user

# Roles permanentes: leader, sdd-analyst, implementer, contract-reviewer, ux-reviewer (solo Console, para cambios de UI) y human-reviewer.
# contract-reviewer se activa solo para impacto contractual. human-reviewer (el usuario) es el reviewer independiente
# por defecto; un agente `reviewer` solo existe si el usuario delega explícitamente la revisión.
# `reviewer` (Sonnet 5.5 / medium) revisa un WI solo si el usuario delega WI por WI o mientras el «Modo fuera de casa» (`awayMode`) esté activo.
# merge-reviewer (Sonnet 5.5 / medium) revisa UNA FUSIÓN antes de integrar una rama de tercero o de integración en una línea
# compartida (feature/jean, develop o main) o antes de publicarla. Rol canónico: harness/roles/merge-reviewer.md.
